<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SandoK TPV" />
    <meta name="description" content="Sistema TPV de SandoK" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700;900&display=swap" rel="stylesheet" />
    <title>SandoK TPV</title>
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body, #root { width: 100%; height: 100%; }
      body {
        background: #111111;
        font-family: 'DM Sans', sans-serif;
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
      }
      /* Safe area para iOS (notch, Dynamic Island) y Android */
      :root {
        --sab: env(safe-area-inset-bottom, 0px);
        --sat: env(safe-area-inset-top, 0px);
      }
      /* Header — respeta la barra de estado del iPhone */
      .app-header {
        padding-top: env(safe-area-inset-top, 0px) !important;
      }
      /* Barra de navegación inferior */
      .bottom-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 100;
        background: #111111;
        border-top: 2px solid #D4A017;
        display: flex;
        overflow-x: auto;
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      .bottom-nav-btn {
        flex: 0 0 auto;
        min-width: 60px;
        border: none;
        background: none;
        color: #777777;
        padding-top: 10px;
        padding-bottom: 10px;
        cursor: pointer;
        font-family: inherit;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        -webkit-appearance: none;
        touch-action: manipulation;
      }
      .bottom-nav-btn.active {
        background: #2A2200;
        color: #D4A017;
        border-top: 2px solid #D4A017;
        margin-top: -2px;
      }
      .bottom-nav-btn span.icon { font-size: 20px; line-height: 1; }
      .bottom-nav-btn span.label { font-size: 9px; font-weight: 700; }
      /* Botón cobrar fijo */
      .cobrar-bar {
        position: fixed;
        left: 0;
        right: 0;
        background: #111111;
        border-top: 2px solid #D4A017;
        padding: 12px 16px;
        z-index: 99;
        bottom: calc(62px + env(safe-area-inset-bottom, 0px));
      }
      @supports (padding: env(safe-area-inset-bottom)) {
        .bottom-nav { padding-bottom: env(safe-area-inset-bottom); }
        .cobrar-bar { bottom: calc(62px + env(safe-area-inset-bottom)); }
        .app-header { padding-top: env(safe-area-inset-top) !important; }
      }
      @media print {
        body * { visibility: hidden; }
        #ticket-print, #ticket-print * { visibility: visible; }
        #ticket-print { position: fixed; left: 0; top: 0; width: 80mm; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
